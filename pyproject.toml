[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gamma-spec-analysis"
version = "0.1.0"
description = "Tools for gamma spectrum analysis"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.21.1",
    "scipy>=1.7.0",
    "matplotlib>=3.4.2",
    "pandas>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "flake8>=6.0",
]

[tool.setuptools]
# Keep the existing top-level module imports while storing source files in src/.
package-dir = {"" = "src"}
py-modules = [
    "gs_analysis",
    "gs_background",
    "gs_creator",
    "gs_multispectral_scaling",
    "gs_peak_fitting",
    "gs_plotting",
    "gs_smoothing",
    "gs_spe_reading",
    "gs_spe_writer",
    "ph_spectrum",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
